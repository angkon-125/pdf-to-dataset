[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angkon-dataset-factory"
version = "0.2.0"
description = "Local-first PDF-to-dataset preparation with provenance, optional LLM generation, and human review"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24,<2",
  "requests>=2.31,<3",
  "streamlit>=1.39,<2",
  "pandas>=2.0,<3",
]

[project.scripts]
angkon-dataset = "angkon_factory.cli:main"

[tool.setuptools.packages.find]
include = ["angkon_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
